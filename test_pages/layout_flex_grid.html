<!DOCTYPE html>
<html>
<head>
    <title>Flexbox and Grid Layout</title>
    <style>
        .flex-row {
            display: flex;
            flex-direction: row;
            gap: 15px;
            background-color: #edf2f7;
            padding: 10px;
            margin-bottom: 20px;
        }
        .flex-item {
            background-color: #4299e1;
            color: #ffffff;
            padding: 15px;
            flex-grow: 1;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-gap: 10px;
            background-color: #e2e8f0;
            padding: 10px;
            width: 500px;
        }
        .grid-item {
            background-color: #48bb78;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Flexbox Row</h1>
    <div class="flex-row">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <h1>Grid Layout</h1>
    <div class="grid-container">
        <div class="grid-item">Cell 1</div>
        <div class="grid-item">Cell 2</div>
        <div class="grid-item">Cell 3</div>
        <div class="grid-item">Cell 4</div>
    </div>
</body>
</html>
