<!DOCTYPE html>
<html>
<head>
    <title>Positioning Test</title>
    <style>
        .relative-box {
            position: relative;
            top: 15px;
            left: 25px;
            background-color: #fbd38d;
            padding: 15px;
            border: 1px solid #dd6b20;
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>Relative Positioning</h1>
    <div class="relative-box">
        This box has relative offset (top: 15px, left: 25px).
    </div>
</body>
</html>
