<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling and Box Model</title>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: sans-serif;
            margin: 20px;
        }
        .card {
            background-color: #ffffff;
            border: 2px solid #2b6cb0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            width: 400px;
        }
        .header {
            color: #2b6cb0;
            font-size: 22px;
            margin-top: 0;
        }
        .highlight {
            color: #e53e3e;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="header">Card Container</h2>
        <p>Testing borders, backgrounds, padding, margins, and <span class="highlight">highlighted text</span>.</p>
    </div>
</body>
</html>
