name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build, Test & Package on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev fonts-liberation

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binary
        run: cargo build --release -p breeze_ui --verbose

      - name: Upload Browser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: breeze-browser-ubuntu-x86_64
          path: target/release/breeze
          if-no-files-found: error
