[package]
name = "breeze_ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "breeze"
path = "src/main.rs"

[dependencies]
breeze_core = { path = "../breeze_core" }
breeze_html = { path = "../breeze_html" }
breeze_css = { path = "../breeze_css" }
breeze_layout = { path = "../breeze_layout" }
breeze_render = { path = "../breeze_render" }
breeze_net = { path = "../breeze_net" }
breeze_js = { path = "../breeze_js" }
minifb = "0.27"
tiny-skia = "0.12"
fontdue = "0.9"
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"
